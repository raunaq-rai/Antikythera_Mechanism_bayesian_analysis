[project]
name = "S2_Coursework"
version = "0.1.0"
description = "Bayesian inference and model comparison for the Antikythera Mechanism calendar ring"
authors = [
    { name="Raunaq Rai", email="rsr45@cam.ac.uk" }
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.dependencies]
pandas = "^2.2.1"
matplotlib = "^3.8.3"
numpy = "^1.26.4"
jax = {extras = ["cpu"], version = "^0.4.25"}
jaxlib = "^0.4.25"
corner = "^2.2.2"
numpyro = "^0.13.2"
scipy = "^1.12.0"
arviz = "^0.18.0"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

